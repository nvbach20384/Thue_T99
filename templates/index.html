<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
</head>
<body>
    <div id="sidebar">
        <h2>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #3b82f6;"><path d="M12 2a2 2 0 0 1 2 2c-.11.88-.34 1.5-.7 1.85-.36.35-1 .57-1.3.65a2 2 0 0 0-2 2v1h4a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4v1a2 2 0 0 0 2 2 2 2 0 0 1-2 2H6a2 2 0 0 1-2-2 2 2 0 0 0 2-2v-1H2a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h1a2 2 0 0 0 2-2v-2a2 2 0 0 1 2-2h4v-1a2 2 0 0 0-2-2 2 2 0 0 1 2-2z"/></svg>
            Cấu hình
        </h2>
        <div>
            <label for="api-key-input">Gemini API Key</label>
            <input type="password" id="api-key-input" placeholder="Nhập API Key để bắt đầu...">
        </div>
    </div>
    <div id="main-chat">
        <div id="chat-header">
            <h1>AI Document Assistant</h1>
        </div>
        
        <div id="chat-history">
            <div class="message bot">
                <p>Xin chào! Tôi đã sẵn sàng hỗ trợ bạn phân tích các tài liệu PDF. Hãy nhập câu hỏi của bạn xuống bên dưới.</p>
            </div>
        </div>
        
        <div class="typing-indicator" id="typing-indicator">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div id="input-container">
            <div id="input-area">
                <input type="text" id="message-input" placeholder="Nhập câu hỏi của bạn về tài liệu..." autocomplete="off">
                <button id="send-button" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            }
        });

        document.getElementById('api-key-input').addEventListener('change', function() {
            localStorage.setItem('gemini_api_key', this.value);
        });

        document.getElementById('message-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const messageInput = document.getElementById('message-input');
            const message = messageInput.value.trim();
            const apiKey = document.getElementById('api-key-input').value.trim();

            if (!message) return;
            if (!apiKey) {
                alert('Vui lòng nhập Gemini API Key ở thanh bên trái!');
                document.getElementById('api-key-input').focus();
                return;
            }

            appendMessage(message, 'user');
            messageInput.value = '';

            const typingIndicator = document.getElementById('typing-indicator');
            const chatHistory = document.getElementById('chat-history');
            
            typingIndicator.style.display = 'flex';
            chatHistory.appendChild(typingIndicator);
            scrollToBottom();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, api_key: apiKey })
                });

                typingIndicator.style.display = 'none';

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    appendMessage('Lỗi: ' + data.error, 'bot');
                } else {
                    appendMessage(data.reply, 'bot', true);
                }
            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('Đã xảy ra lỗi khi kết nối với máy chủ.', 'bot');
                console.error(error);
            }
        }

        function appendMessage(text, sender, parseMarkdown = false) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            if (parseMarkdown && sender === 'bot') {
                messageDiv.innerHTML = marked.parse(text);
            } else {
                messageDiv.textContent = text;
            }

            const typingIndicator = document.getElementById('typing-indicator');
            if(typingIndicator.parentNode === chatHistory) {
                chatHistory.insertBefore(messageDiv, typingIndicator);
            } else {
                chatHistory.appendChild(messageDiv);
            }
            
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatHistory = document.getElementById('chat-history');
            chatHistory.scrollTo({
                top: chatHistory.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
